services:
  - type: web
    name: livestream-studio-server
    runtime: node
    plan: free
    # Closest free region to the Philippine host. Render cannot move an
    # existing service: a service created in another region must be
    # recreated for this to take effect.
    region: singapore
    # NODE_ENV=production still needs the locked TypeScript build dependencies.
    # Only the server and shared workspaces (plus the root TypeScript): the
    # client's in-browser AI packages never ship to the free 512 MB instance.
    buildCommand: npm ci --include=dev --workspace=server --workspace=shared --include-workspace-root && npm run -w shared build && npm run -w server build
    startCommand: npm run -w server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URLS
        value: https://studio.arnoldfamini.com
      - key: LIVE_STREAM_TOKEN_SECRET
        sync: false
      # Owner-only studio creation. Set at least one: the owner's account
      # email(s) (comma-separated), and/or a long random key the owner enters
      # once per browser. With neither set, anyone can create a studio and
      # /health reports the warning "studio-creation-open".
      - key: STUDIO_OWNER_EMAILS
        sync: false
      - key: STUDIO_CREATE_SECRET
        sync: false
      # Control plane: lets signaling revoke a removed guest's media-server
      # (SFU) session and recording uploads right away.
      - key: MEDIA_SERVER_URL
        value: https://livestream-studio-media-server.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: OPENAI_API_KEY
        sync: false
      # AI routes stay locked (503) while OPENAI_API_KEY is set without a
      # policy. Studio owners (STUDIO_OWNER_EMAILS) are allowed by default;
      # these narrow or widen that.
      - key: OPENAI_ALLOWED_ACCOUNT_EMAILS
        sync: false
      - key: OPENAI_ACCESS_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_HIGHLIGHT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EPISODE_CONTENT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_CAPTION_TRANSLATION_MODEL
        value: gpt-4o-mini
      - key: ICE_TRANSPORT_POLICY
        value: all
      # Cloudflare Realtime TURN (free allowance; recommended). Without it the
      # server falls back to the shared Open Relay.
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: ICE_SERVERS_JSON
        sync: false
      - key: STUN_URLS
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_CREDENTIAL_TYPE
        sync: false
      - key: TURN_STATIC_AUTH_SECRET
        sync: false
      - key: TURN_CREDENTIAL_TTL_SECONDS
        value: "86400"

  - type: web
    name: livestream-studio-media-server
    runtime: docker
    plan: free
    # The host uploads the whole program here over one TCP connection; a
    # short hop from the Philippines matters more than the datacenter-to-
    # datacenter leg to YouTube/Facebook. Recreate the service to move it.
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URLS
        value: https://studio.arnoldfamini.com
      - key: LIVE_STREAM_TOKEN_SECRET
        sync: false
      - key: RECORDING_STORAGE_ENDPOINT
        sync: false
      - key: RECORDING_STORAGE_REGION
        value: us-east-1
      - key: RECORDING_STORAGE_BUCKET
        sync: false
      - key: RECORDING_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: RECORDING_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: RECORDING_STORAGE_FORCE_PATH_STYLE
        value: true
      - key: RECORDING_STORAGE_PREFIX
        value: livestream-studio
      - key: RECORDING_STORAGE_PUBLIC_BASE_URL
        sync: false
      # One broadcast at a time on the free instance.
      - key: MAX_RELAY_SESSIONS
        value: "1"
      # Deck rendering needs a studio token (the default in production).
      - key: PRESENTATION_RENDER_REQUIRE_AUTH
        value: "true"
      # Keep at least this much disk free for HLS and the live backup.
      - key: RECORDING_UPLOAD_MIN_FREE_MB
        value: "1024"
      # SFU relay: Render has no inbound UDP, so the werift SFU allocates its
      # candidates on Cloudflare Realtime TURN. By default it asks the signaling
      # server for credentials (signed with LIVE_STREAM_TOKEN_SECRET), so these
      # two are optional; set them only to give the media server its own key.
      - key: SIGNALING_SERVER_URL
        value: https://livestream-studio-server.onrender.com
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: SFU_TURN_TRANSPORT
        value: udp

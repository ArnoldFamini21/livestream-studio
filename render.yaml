services:
  - type: web
    name: livestream-studio-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run -w shared build && npm run -w server build
    startCommand: npm run -w server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URLS
        value: https://studio.arnoldfamini.com
      - key: LIVE_STREAM_TOKEN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_HIGHLIGHT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EPISODE_CONTENT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_CAPTION_TRANSLATION_MODEL
        value: gpt-4o-mini
      - key: ICE_TRANSPORT_POLICY
        value: all
      - key: ICE_SERVERS_JSON
        sync: false
      - key: STUN_URLS
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_CREDENTIAL_TYPE
        sync: false

  - type: web
    name: livestream-studio-media-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URLS
        value: https://studio.arnoldfamini.com
      - key: LIVE_STREAM_TOKEN_SECRET
        sync: false
      - key: RECORDING_STORAGE_ENDPOINT
        sync: false
      - key: RECORDING_STORAGE_REGION
        value: us-east-1
      - key: RECORDING_STORAGE_BUCKET
        sync: false
      - key: RECORDING_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: RECORDING_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: RECORDING_STORAGE_FORCE_PATH_STYLE
        value: true
      - key: RECORDING_STORAGE_PREFIX
        value: livestream-studio
      - key: RECORDING_STORAGE_PUBLIC_BASE_URL
        sync: false

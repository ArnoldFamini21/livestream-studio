services:
  - type: web
    name: livestream-studio-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run -w shared build && npm run -w server build
    startCommand: npm run -w server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URLS
        value: https://studio.arnoldfamini.com
      - key: LIVE_STREAM_TOKEN_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: ICE_TRANSPORT_POLICY
        value: all
      - key: ICE_SERVERS_JSON
        sync: false
      - key: STUN_URLS
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_CREDENTIAL_TYPE
        sync: false

  - type: web
    name: livestream-studio-media-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run -w shared build && npm run -w media-server build
    startCommand: npm run -w media-server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URLS
        value: https://studio.arnoldfamini.com
      - key: LIVE_STREAM_TOKEN_SECRET
        sync: false

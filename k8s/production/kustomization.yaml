apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: livestream-studio
resources:
  - namespace.yaml
  - configmap.yaml
  - server-deployment.yaml
  - media-server-deployment.yaml
  - services.yaml
  - ingress.yaml
  - pod-disruption-budgets.yaml
commonLabels:
  app.kubernetes.io/managed-by: kustomize
images:
  - name: ghcr.io/arnoldfamini21/livestream-studio-server
    newName: registry.example.com/livestream-studio-server
    newTag: replace-me
  - name: ghcr.io/arnoldfamini21/livestream-studio-media-server
    newName: registry.example.com/livestream-studio-media-server
    newTag: replace-me

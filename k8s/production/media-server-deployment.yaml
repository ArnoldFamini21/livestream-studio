apiVersion: apps/v1
kind: Deployment
metadata:
  name: livestream-studio-media-server
  labels:
    app.kubernetes.io/name: livestream-studio-media-server
    app.kubernetes.io/component: media-relay
    app.kubernetes.io/part-of: livestream-studio
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: livestream-studio-media-server
      app.kubernetes.io/component: media-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livestream-studio-media-server
        app.kubernetes.io/component: media-relay
        app.kubernetes.io/part-of: livestream-studio
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-server
          image: ghcr.io/arnoldfamini21/livestream-studio-media-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              value: "3002"
          envFrom:
            - configMapRef:
                name: livestream-studio-config
            - secretRef:
                name: livestream-studio-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 20Gi

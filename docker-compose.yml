name: livestream-studio

x-workspace-volumes: &workspace-volumes
  - .:/app
  - studio-root-node-modules:/app/node_modules
  - studio-client-node-modules:/app/client/node_modules
  - studio-server-node-modules:/app/server/node_modules
  - studio-media-node-modules:/app/media-server/node_modules
  - studio-shared-node-modules:/app/shared/node_modules

x-live-secret: &live-secret ${LIVE_STREAM_TOKEN_SECRET:-local-development-live-stream-token-secret}

services:
  client:
    build:
      context: .
      target: dev
    command: npm run dev --workspace=client -- --host 0.0.0.0
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001/ws}
      VITE_MEDIA_WS_URL: ${VITE_MEDIA_WS_URL:-ws://localhost:3002/rtmp}
      VITE_INVITE_BASE_URL: ${VITE_INVITE_BASE_URL:-http://localhost:5173}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes: *workspace-volumes
    depends_on:
      - server
      - media-server
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: .
      target: dev
    command: npm run dev --workspace=server
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-}
      PGSSLMODE: ${PGSSLMODE:-disable}
      ROOM_PERSISTENCE_DISABLED: ${ROOM_PERSISTENCE_DISABLED:-false}
      LIVE_STREAM_TOKEN_SECRET: *live-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      ICE_TRANSPORT_POLICY: ${ICE_TRANSPORT_POLICY:-all}
      ICE_SERVERS_JSON: ${ICE_SERVERS_JSON:-}
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      TURN_CREDENTIAL_TYPE: ${TURN_CREDENTIAL_TYPE:-}
    volumes: *workspace-volumes
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    profiles:
      - persistence
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-livestream_studio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - studio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-studio} -d $${POSTGRES_DB:-livestream_studio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  media-server:
    build:
      context: .
      target: dev
    command: npm run dev --workspace=media-server
    ports:
      - "${MEDIA_SERVER_PORT:-3002}:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:5173}
      LIVE_STREAM_TOKEN_SECRET: *live-secret
      FFMPEG_PATH: ${FFMPEG_PATH:-}
      RECORDING_STORAGE_ENDPOINT: ${RECORDING_STORAGE_ENDPOINT:-}
      RECORDING_STORAGE_REGION: ${RECORDING_STORAGE_REGION:-us-east-1}
      RECORDING_STORAGE_BUCKET: ${RECORDING_STORAGE_BUCKET:-}
      RECORDING_STORAGE_ACCESS_KEY_ID: ${RECORDING_STORAGE_ACCESS_KEY_ID:-}
      RECORDING_STORAGE_SECRET_ACCESS_KEY: ${RECORDING_STORAGE_SECRET_ACCESS_KEY:-}
      RECORDING_STORAGE_FORCE_PATH_STYLE: ${RECORDING_STORAGE_FORCE_PATH_STYLE:-true}
      RECORDING_STORAGE_PREFIX: ${RECORDING_STORAGE_PREFIX:-livestream-studio}
      RECORDING_STORAGE_PUBLIC_BASE_URL: ${RECORDING_STORAGE_PUBLIC_BASE_URL:-}
    volumes: *workspace-volumes
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - studio-prometheus-data:/prometheus
    depends_on:
      - server
      - media-server

  grafana:
    image: grafana/grafana-oss:latest
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - studio-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  studio-root-node-modules:
  studio-client-node-modules:
  studio-server-node-modules:
  studio-media-node-modules:
  studio-shared-node-modules:
  studio-postgres-data:
  studio-prometheus-data:
  studio-grafana-data:

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: livestream-studio-signaling
    metrics_path: /metrics
    static_configs:
      - targets:
          - server:3001

  - job_name: livestream-studio-media-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - media-server:3002

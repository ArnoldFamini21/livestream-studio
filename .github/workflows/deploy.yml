name: Build and Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_client:
        description: Build and publish the Hostinger client
        type: boolean
        default: true
      deploy_signaling:
        description: Trigger the Render deploy hook for livestream-studio-server
        type: boolean
        default: false
      deploy_media:
        description: Trigger the Render deploy hook for livestream-studio-media-server
        type: boolean
        default: false
      verify_services:
        description: Verify Render health, commit metadata, and host access after this run
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: changed-paths
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [ "$event_name" = "workflow_dispatch" ]; then
            : > changed-files.txt
          elif [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$after" > changed-files.txt
          else
            if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=2 origin "$before" || true
            fi

            if git cat-file -e "$before^{commit}" 2>/dev/null; then
              git diff --name-only "$before" "$after" > changed-files.txt
            else
              git diff-tree --no-commit-id --name-only -r "$after" > changed-files.txt
            fi
          fi

          echo "Changed files:"
          cat changed-files.txt
          node scripts/classify-production-changes.mjs --files-from changed-files.txt --github-output "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test deployment scripts
        run: node --test scripts/*.test.mjs

      - name: Build shared workspace
        run: npm run -w shared build

      - name: Build server
        run: npm run -w server build

      - name: Build media server
        run: npm run -w media-server build

      - name: Build client
        run: npm run -w client build
        env:
          VITE_API_URL: https://livestream-studio-server.onrender.com
          VITE_WS_URL: wss://livestream-studio-server.onrender.com/ws
          VITE_MEDIA_WS_URL: wss://livestream-studio-media-server.onrender.com/rtmp
          VITE_MEDIA_HTTP_URL: https://livestream-studio-media-server.onrender.com
          VITE_INVITE_BASE_URL: https://studio.arnoldfamini.com

      - name: Trigger Render deploys
        id: render-deploys
        continue-on-error: true
        env:
          RENDER_SERVER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK_URL }}
          RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL }}
          SIGNALING_CHANGED: ${{ steps.changed-paths.outputs.signaling_changed }}
          MEDIA_CHANGED: ${{ steps.changed-paths.outputs.media_changed }}
          FORCE_SIGNALING_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_signaling }}
          FORCE_MEDIA_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_media }}
        run: |
          hooks_configured=true
          services_changed=false

          if [ "$SIGNALING_CHANGED" = "true" ] || [ "$FORCE_SIGNALING_DEPLOY" = "true" ]; then
            services_changed=true
            if [ -n "$RENDER_SERVER_DEPLOY_HOOK_URL" ]; then
              curl --fail --silent --show-error --request POST "$RENDER_SERVER_DEPLOY_HOOK_URL"
            else
              hooks_configured=false
              if [ "$FORCE_SIGNALING_DEPLOY" = "true" ]; then
                echo "::error::RENDER_SERVER_DEPLOY_HOOK_URL is required because this manual run deploys the signaling server."
              else
                echo "::error::RENDER_SERVER_DEPLOY_HOOK_URL is required because signaling-server files changed."
              fi
            fi
          else
            echo "::notice::No signaling-server changes detected; skipping signaling server deploy trigger."
          fi

          if [ "$MEDIA_CHANGED" = "true" ] || [ "$FORCE_MEDIA_DEPLOY" = "true" ]; then
            services_changed=true
            if [ -n "$RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL" ]; then
              curl --fail --silent --show-error --request POST "$RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL"
            else
              hooks_configured=false
              if [ "$FORCE_MEDIA_DEPLOY" = "true" ]; then
                echo "::error::RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL is required because this manual run deploys the media server."
              else
                echo "::error::RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL is required because media-server files changed."
              fi
            fi
          else
            echo "::notice::No media-server changes detected; skipping media-server deploy trigger."
          fi

          echo "hooks_configured=$hooks_configured" >> "$GITHUB_OUTPUT"
          echo "services_changed=$services_changed" >> "$GITHUB_OUTPUT"

          if { [ "$SIGNALING_CHANGED" = "true" ] || [ "$FORCE_SIGNALING_DEPLOY" = "true" ]; } && [ -z "$RENDER_SERVER_DEPLOY_HOOK_URL" ]; then
            exit 1
          fi

          if { [ "$MEDIA_CHANGED" = "true" ] || [ "$FORCE_MEDIA_DEPLOY" = "true" ]; } && [ -z "$RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL" ]; then
            exit 1
          fi

      - name: Deploy to deploy branch
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_client }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          publish_branch: deploy
          keep_files: false

      - name: Verify static client cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_client }}
        run: npm run production:check
        env:
          PRODUCTION_CHECK_SCOPE: client
          PRODUCTION_REQUIRE_CLIENT_CACHE: 'true'
          PRODUCTION_REQUIRE_MEDIA_SERVER: 'false'
          PRODUCTION_CHECK_WAIT_MS: 300000
          PRODUCTION_CHECK_INTERVAL_MS: 15000

      # Always publish the static client first. A missing Render hook must still
      # fail the workflow, but should not prevent the Hostinger release that can
      # ship independently of a backend change.
      - name: Report required Render deployment failure
        if: ${{ steps.render-deploys.outcome == 'failure' }}
        run: |
          echo "::error::The client was deployed, but one or more required Render deploy hooks are missing or failed. Configure the Render hook secrets and rerun this workflow."
          exit 1

      - name: Verify production services
        if: ${{ (steps.render-deploys.outputs.services_changed == 'true' && steps.render-deploys.outputs.hooks_configured == 'true') || (github.event_name == 'workflow_dispatch' && inputs.verify_services) }}
        run: npm run production:check
        env:
          PRODUCTION_CHECK_SCOPE: services
          EXPECTED_COMMIT: ${{ github.sha }}
          PRODUCTION_CHECK_WAIT_MS: 900000
          PRODUCTION_CHECK_INTERVAL_MS: 15000
          PRODUCTION_REQUIRE_TURN: ${{ vars.PRODUCTION_REQUIRE_TURN }}
          PRODUCTION_REQUIRE_HOST_ACCESS: 'true'

name: Build and Deploy to Hostinger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run -w shared build

      - name: Build server
        run: npm run -w server build

      - name: Build media server
        run: npm run -w media-server build

      - name: Build client
        run: npm run -w client build
        env:
          VITE_API_URL: https://livestream-studio-server.onrender.com
          VITE_WS_URL: wss://livestream-studio-server.onrender.com/ws
          VITE_MEDIA_WS_URL: wss://livestream-studio-media-server.onrender.com/rtmp
          VITE_MEDIA_HTTP_URL: https://livestream-studio-media-server.onrender.com
          VITE_INVITE_BASE_URL: https://studio.arnoldfamini.com

      - name: Trigger Render deploys
        id: render-deploys
        env:
          RENDER_SERVER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK_URL }}
          RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL }}
        run: |
          hooks_configured=true

          if [ -n "$RENDER_SERVER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$RENDER_SERVER_DEPLOY_HOOK_URL"
          else
            hooks_configured=false
            echo "::notice::RENDER_SERVER_DEPLOY_HOOK_URL is not configured; skipping signaling server deploy trigger."
          fi

          if [ -n "$RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL"
          else
            hooks_configured=false
            echo "::notice::RENDER_MEDIA_SERVER_DEPLOY_HOOK_URL is not configured; skipping media-server deploy trigger."
          fi

          echo "hooks_configured=$hooks_configured" >> "$GITHUB_OUTPUT"

      - name: Deploy to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          publish_branch: deploy
          keep_files: false

      - name: Verify production services
        if: steps.render-deploys.outputs.hooks_configured == 'true'
        run: npm run production:check
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          PRODUCTION_CHECK_WAIT_MS: 900000
          PRODUCTION_CHECK_INTERVAL_MS: 15000

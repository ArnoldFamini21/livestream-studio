name: CI

# Pull requests run the same checks that gate a production deploy, so a
# regression shows up on the PR instead of after it reaches main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run -w shared build

      - name: Typecheck all workspaces
        run: npm run lint

      - name: Run all test suites
        run: npm test

      - name: Build all workspaces
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/output/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Build local browser qualification target
        run: |
          npm run -w shared build
          npm run -w server build
          npm run -w client build
        env:
          VITE_API_URL: http://localhost:3001
          VITE_WS_URL: ws://localhost:3001/ws
          VITE_MEDIA_HTTP_URL: http://localhost:3001
          VITE_MEDIA_WS_URL: ws://localhost:3001/rtmp
          VITE_INVITE_BASE_URL: http://localhost:5199
      - name: Qualify studio with host, guest and viewer browsers
        run: npm run test:e2e
      - name: Upload screenshots and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qualification
          path: |
            output/e2e/*.png
            output/e2e/*.txt
            output/e2e/*.json
            output/e2e/*.log
          retention-days: 7

name: CI

# Pull requests run the same checks that gate a production deploy, so a
# regression shows up on the PR instead of after it reaches main.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      recording_soak:
        description: Run three-participant recording qualification (35-second preflight, then two twenty-minute takes)
        type: boolean
        default: false
      recording_encoder:
        description: Recording encoder to exercise in the isolated soak build
        type: choice
        default: browser
        options:
          - browser
          - webcodecs
          - webcodecs-owned
          - webcodecs-h264
      recording_preflight_only:
        description: Run only the 35-second recording preflight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on a named Ubuntu image, never `ubuntu-latest`. That label moved to
# Ubuntu 26.04 (FFmpeg 8.0.1) on 2026-11-13, and four media-server FFmpeg tests fail
# there (edited export, relay restart). Ubuntu 24.04 ships FFmpeg 6.1.1, the same
# major version as the production media server (ffmpeg-static). Move to a newer image
# only after those tests pass on its FFmpeg. scripts/dependency-policy.test.mjs checks this.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install FFmpeg (Ubuntu packages, GitHub releases as fallback)
        # Two sources, each bounded in time, so neither an Ubuntu mirror outage nor
        # a GitHub releases outage stalls or fails the job by itself. The script
        # exports FFMPEG_BIN to the following steps when the system binary works.
        timeout-minutes: 6
        run: sh scripts/ci-install-ffmpeg.sh
      - name: Install dependencies
        run: sh scripts/npm-ci-retry.sh

      - name: Build shared workspace
        run: npm run -w shared build

      - name: Typecheck all workspaces
        run: npm run lint

      - name: Run all test suites
        run: npm test

      - name: Build all workspaces
        run: npm run build

  browser:
    runs-on: ubuntu-24.04
    # A normal run takes about ten minutes; the rest covers the fallback installs.
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/output/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install FFmpeg (Ubuntu packages, GitHub releases as fallback)
        # Two sources, each bounded in time, so neither an Ubuntu mirror outage nor
        # a GitHub releases outage stalls or fails the job by itself. The script
        # exports FFMPEG_BIN to the following steps when the system binary works.
        timeout-minutes: 6
        run: sh scripts/ci-install-ffmpeg.sh
      - name: Install dependencies and Chromium
        run: |
          sh scripts/npm-ci-retry.sh
          sh scripts/ci-install-chromium.sh
      - name: Build local browser qualification target
        run: |
          npm run -w shared build
          npm run -w server build
          npm run -w client build
        env:
          VITE_API_URL: http://localhost:3001
          VITE_WS_URL: ws://localhost:3001/ws
          VITE_MEDIA_HTTP_URL: http://localhost:3001
          VITE_MEDIA_WS_URL: ws://localhost:3001/rtmp
          VITE_INVITE_BASE_URL: http://localhost:5199
      - name: Qualify studio, viewer engagement and anonymous error intake in serial browser suites
        run: npm run test:e2e
      - name: Upload screenshots and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qualification
          path: |
            output/e2e/*.png
            output/e2e/*.txt
            output/e2e/*.json
            output/e2e/*.log
            output/e2e/client-errors/*.png
            output/e2e/client-errors/*.txt
            output/e2e/client-errors/*.json
            output/e2e/client-errors/*.log
            output/e2e/viewer-chat/*.png
            output/e2e/viewer-chat/*.txt
            output/e2e/viewer-chat/*.json
            output/e2e/viewer-chat/*.log
            output/e2e/service-tools/*.png
            output/e2e/service-tools/*.txt
            output/e2e/service-tools/*.json
            output/e2e/service-tools/*.log
            output/e2e/watch-events/*.png
            output/e2e/watch-events/*.txt
            output/e2e/watch-events/*.json
            output/e2e/watch-events/*.log
            output/e2e/transcript-editor/*.png
            output/e2e/transcript-editor/*.txt
            output/e2e/transcript-editor/*.json
            output/e2e/transcript-editor/*.log
            output/e2e/production-rundown/*.png
            output/e2e/production-rundown/*.txt
            output/e2e/production-rundown/*.json
            output/e2e/production-rundown/*.log
            output/e2e/premiere-watch/*.png
            output/e2e/premiere-watch/*.txt
            output/e2e/premiere-watch/*.json
            output/e2e/premiere-watch/*.log
          retention-days: 7

  recording-soak:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recording_soak }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      VITE_RECORDING_ENCODER: ${{ inputs.recording_encoder }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001/ws
      VITE_MEDIA_HTTP_URL: http://localhost:3001
      VITE_MEDIA_WS_URL: ws://localhost:3001/rtmp
      VITE_INVITE_BASE_URL: http://localhost:5199
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install FFmpeg (Ubuntu packages, GitHub releases as fallback)
        # A separate step: FFMPEG_BIN reaches only the steps after the one that exports it.
        timeout-minutes: 6
        run: sh scripts/ci-install-ffmpeg.sh
      - name: Provision and verify FFprobe
        timeout-minutes: 3
        shell: bash
        run: |
          probe=/usr/bin/ffprobe
          if [ ! -x "$probe" ] || ! "$probe" -version; then
            # ffmpeg-static supplies only ffmpeg. Use the companion probe
            # from its pinned release when the Ubuntu package is unavailable.
            probe_dir="$(mktemp -d "$RUNNER_TEMP/recording-ffprobe.XXXXXXXX")"
            archive="$probe_dir/ffprobe.gz"
            probe="$probe_dir/ffprobe"
            curl --fail --location --silent --show-error --proto '=https' \
              --connect-timeout 12 --max-time 45 --retry 2 --output "$archive" \
              https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64.gz
            printf '%s  %s\n' '25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067' "$archive" | sha256sum -c -
            gzip -dc "$archive" > "$probe"
            chmod 700 "$probe"
            "$probe" -version
          fi
          printf 'FFPROBE_PATH=%s\n' "$probe" >> "$GITHUB_ENV"
      - name: Install dependencies and Chromium
        run: |
          sh scripts/npm-ci-retry.sh
          sh scripts/ci-install-chromium.sh
      - name: Build local recording qualification target
        run: |
          npm run -w shared build
          npm run -w server build
          npm run -w client build
      - name: Preflight recording, transfer, reconnect and analysis
        id: recording_preflight
        run: npm run test:recording-soak
        env:
          SOAK_SECONDS: '35'
          SOAK_ARTIFACT_DIR: ${{ github.workspace }}/output/recording-soak/preflight
      - name: Qualify twenty-minute three-participant recording
        id: recording_qualification
        # Keep the short-run result and collect long-run evidence even if the
        # preflight failed a packet timing assertion.
        if: ${{ !cancelled() && !inputs.recording_preflight_only && (steps.recording_preflight.outcome == 'success' || steps.recording_preflight.outcome == 'failure') }}
        run: npm run test:recording-soak
        env:
          SOAK_SECONDS: '1200'
          SOAK_ARTIFACT_DIR: ${{ github.workspace }}/output/recording-soak/qualification
      - name: Repeat twenty-minute three-participant recording
        if: ${{ !cancelled() && (steps.recording_qualification.outcome == 'success' || steps.recording_qualification.outcome == 'failure') }}
        run: npm run test:recording-soak
        env:
          SOAK_SECONDS: '1200'
          SOAK_ARTIFACT_DIR: ${{ github.workspace }}/output/recording-soak/qualification-repeat
      - name: Upload recording qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-soak-evidence
          path: |
            output/recording-soak/*/*.json
            output/recording-soak/*/*.log
            output/recording-soak/*/*.txt
            output/recording-soak/*/*.png
          retention-days: 7

name: CI

# Pull requests run the same checks that gate a production deploy, so a
# regression shows up on the PR instead of after it reaches main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run -w shared build

      - name: Typecheck all workspaces
        run: npm run lint

      - name: Run all test suites
        run: npm test

      - name: Build all workspaces
        run: npm run build

name: CI

# Pull requests run the same checks that gate a production deploy, so a
# regression shows up on the PR instead of after it reaches main.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      recording_soak:
        description: Run three-participant recording qualification (35-second preflight, then 20 minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install FFmpeg (Ubuntu packages, GitHub releases as fallback)
        # Two sources, each bounded in time, so neither an Ubuntu mirror outage nor
        # a GitHub releases outage stalls or fails the job by itself. The script
        # exports FFMPEG_BIN to the following steps when the system binary works.
        timeout-minutes: 6
        run: sh scripts/ci-install-ffmpeg.sh
      - name: Install dependencies
        run: sh scripts/npm-ci-retry.sh

      - name: Build shared workspace
        run: npm run -w shared build

      - name: Typecheck all workspaces
        run: npm run lint

      - name: Run all test suites
        run: npm test

      - name: Build all workspaces
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    # A normal run takes about ten minutes; the rest covers the fallback installs.
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/output/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install FFmpeg (Ubuntu packages, GitHub releases as fallback)
        # Two sources, each bounded in time, so neither an Ubuntu mirror outage nor
        # a GitHub releases outage stalls or fails the job by itself. The script
        # exports FFMPEG_BIN to the following steps when the system binary works.
        timeout-minutes: 6
        run: sh scripts/ci-install-ffmpeg.sh
      - name: Install dependencies and Chromium
        run: |
          sh scripts/npm-ci-retry.sh
          sh scripts/ci-install-chromium.sh
      - name: Build local browser qualification target
        run: |
          npm run -w shared build
          npm run -w server build
          npm run -w client build
        env:
          VITE_API_URL: http://localhost:3001
          VITE_WS_URL: ws://localhost:3001/ws
          VITE_MEDIA_HTTP_URL: http://localhost:3001
          VITE_MEDIA_WS_URL: ws://localhost:3001/rtmp
          VITE_INVITE_BASE_URL: http://localhost:5199
      - name: Qualify studio and anonymous error intake in serial browser suites
        run: npm run test:e2e
      - name: Upload screenshots and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qualification
          path: |
            output/e2e/*.png
            output/e2e/*.txt
            output/e2e/*.json
            output/e2e/*.log
            output/e2e/client-errors/*.png
            output/e2e/client-errors/*.txt
            output/e2e/client-errors/*.json
            output/e2e/client-errors/*.log
          retention-days: 7

  recording-soak:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recording_soak }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001/ws
      VITE_MEDIA_HTTP_URL: http://localhost:3001
      VITE_MEDIA_WS_URL: ws://localhost:3001/rtmp
      VITE_INVITE_BASE_URL: http://localhost:5199
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install FFmpeg (Ubuntu packages, GitHub releases as fallback)
        # A separate step: FFMPEG_BIN reaches only the steps after the one that exports it.
        timeout-minutes: 6
        run: sh scripts/ci-install-ffmpeg.sh
      - name: Install dependencies and Chromium
        run: |
          sh scripts/npm-ci-retry.sh
          sh scripts/ci-install-chromium.sh
      - name: Build local recording qualification target
        run: |
          npm run -w shared build
          npm run -w server build
          npm run -w client build
      - name: Preflight recording, transfer, reconnect and analysis
        run: npm run test:recording-soak
        env:
          SOAK_SECONDS: '35'
          SOAK_ARTIFACT_DIR: ${{ github.workspace }}/output/recording-soak/preflight
      - name: Qualify twenty-minute three-participant recording
        run: npm run test:recording-soak
        env:
          SOAK_SECONDS: '1200'
          SOAK_ARTIFACT_DIR: ${{ github.workspace }}/output/recording-soak/qualification
      - name: Upload recording qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-soak-evidence
          path: |
            output/recording-soak/*/*.json
            output/recording-soak/*/*.log
            output/recording-soak/*/*.txt
            output/recording-soak/*/*.png
          retention-days: 7
